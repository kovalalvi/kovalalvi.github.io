<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:url" content="{{url}}">
{{card}}
<link rel="canonical" href="{{url}}">
<link rel="alternate" type="application/rss+xml" title="Aleksandr Kovalev" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v={{css_version}}">
<script>
  // theme toggle: a saved choice wins over the OS setting; set before paint to avoid a flash
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  function toggleTheme() {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  }
</script>
</head>
<body>
<header class="site">
  <a class="home" href="/">Aleksandr Kovalev</a>
  <nav><a href="/blog/">Blog</a><a href="/cv.pdf">CV</a><button class="theme-toggle" onclick="toggleTheme()" aria-label="Switch light or dark theme" title="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button></nav>
</header>
<main>
{{content}}
</main>
<footer class="site">
  <span>Aleksandr Kovalev</span>
  <a href="/feed.xml">RSS</a>
</footer>
<!-- page views: GoatCounter, no cookies -->
<script data-goatcounter="https://kovalalvi.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
